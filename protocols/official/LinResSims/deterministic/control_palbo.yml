# LINRESSIMS (deterministic) - CONTROL
# Last update: 2026-11-17

# GLOBAL EXPERIMENTAL SETTINGS

# Paths, files, directories
name: "control_palbo"
model: "/official/2025/"
output_directory: "/results/LinResSims/deterministic/"
sbml:
  - "sparced_2025_linressims_.xml"

# Experimental settings
nb_cells: 1
solver: "bngsim"

# PROTOCOL STEPS 
protocol:
  - step: 1
    name: "Serum-starved incubation"
    duration: 1800    # 30 minutes
  - step: 2
    name: "With cell cycling"
    duration: 86400   # 24 hours
    input:
      origin: 1
      timepoint: "last"
    modifications:  # Amna's cocktail
      E: 1.0
      H: 1.0
      HGF: 0.032
      P: 1.0
      F: 0.02
      I: 0.0899
      INS: 31.633

