# LINRESSIMS (deterministic) - PALBOCICLIB
# Last update: 2026-11-11

# GLOBAL EXPERIMENTAL SETTINGS

# Paths, files, directories
name: "palbociclib"
model: "/official/2025/"
output_directory: "/results/LinResSims/deterministic/"
sbml:
  - "sparced_2025_linressims_.xml"

# Experimental settings
nb_cells: 1
solver: "bngsim"

# PROTOCOL STEPS 
protocol:
  - step: 1
    name: "Serum-starved incubation"
    duration: 1800    # 30 minutes
    modifications:
      palbo_EC: 10000 # 10 µM extracellular palbociclib
  - step: 2
    name: "Addition of growth factors"
    duration: 86400   # 24 hours
    input:
      origin: 1
      timepoint: "last"
    modifications:
      E: 3.3          # EGF (nM)
      INS: 1721.0     # Insulin (nM)
      HGF: 0.005      # HGF (nM) ; required to activate the cell cycle
