# MINI, a smaller version of LinResSims - Control
# Replicate control dose-response of the Mutsuddy 2025 paper
# Last update: 2026-10-27

# GLOBAL EXPERIMENTAL SETTINGS

# Paths, files, directories
name: "Control"
model: "/official/2025"
output_directory: "/results/LinResSims"
sbml:
  - "sparced_2025_linressims_.xml"

# Experimental settings
nb_cells: 10   # 10 replicates (NOT of 100 cells)
solver: "bngsim"

# PROTOCOL STEPS 
protocol:
    - step: 1
      name: "Heterogenization"
      duration: 172800  # 48h
      input:
        origin: 0
      simulation_mode: "stochastic"
    - step: 2
      name: "Incubation"
      duration: 172800  # 48h
      input:
        origin: 1
        timepoint: "last"
      modifications:
        species:
          E: 3.308        # EGF
          INS: 1721.76    # Insulin
      simulation_mode: "stochastic"
    - step: 3
      name: "Cell culture (control - dose 0)"
      duration: 259200  # 72h
      input:
        origin: 2
        timepoint: "random"
      simulation_mode: "lineage"

