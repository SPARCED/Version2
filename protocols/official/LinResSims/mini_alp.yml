# MINI version of LinResSims - Alpelisib
# Replicate alpelisib dose-response of the Mutsuddy 2025 paper
# Last update: 2026-10-27

# GLOBAL EXPERIMENTAL SETTINGS

# Paths, files, directories
name: "Alpelisib"
model: "/official/2025"
output_directory: "/results/LinResSims"
sbml:
  - "sparced_2025_linressims_.xml"

# Experimental settings
nb_cells: 10   # 10 replicates (NOT of 100 cells)
solver: "bngsim"

# PROTOCOL STEPS 
protocol:
    - step: 1
      name: "Cell culture (dose 1)"
      duration: 259200   # 72h
      input:
        name: "Control"
        origin: 2
        timepoint: "random"
      modifications:
        species:
          alpel_EC: 0.0
      simulation_mode: "lineage"
    - step: 2
      name: "Cell culture (dose 2)"
      duration: 259200  # 72h
      input:
        name: "Control"
        origin: 2
        timepoint: "random"
      modifications:
        species:
          alpel_EC: 0.001
      simulation_mode: "lineage"
    - step: 3
      name: "Cell culture (dose 3)"
      duration: 259200  # 72h
      input:
        name: "Control"
        origin: 2
        timepoint: "random"    
      modifications:
        species:
          alpel_EC: 0.003162
      simulation_mode: "lineage"

